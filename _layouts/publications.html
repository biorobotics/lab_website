<script>

const xmlhttp = new XMLHttpRequest();
const queryString = window.location.search;
const urlParams = new URLSearchParams(queryString);

function displayRows(rows, parent){
  rows.forEach(row => {
    const linkText = row.Link ? `<br /> <a href=\"${row.Link}\">Link</a>` : "";
    const videoText = row.Video ? `<br /> <a href=\"${row.Video}\">Video</a>` : "";
    parent.insertAdjacentHTML("beforeend", `
      <p>
        <i>${row.Name}</i> <br />
        ${row.Authors}  <br />
        ${row.Publication}
        ${linkText}
        ${videoText}
      </p>
    `);
  });
}

function displayByTopic(rows){
  const topics = [...new Set(rows.map(v => v.Topic))]
  const results = document.querySelector("#Results");
  topics.toSorted().forEach(topic => {
    const topicMatch = rows.filter(row => row.Topic === topic);
    if(topicMatch.length === 0) return;
    const heading = results.appendChild(document.createElement("h3"));
    heading.textContent = topic;
    const subtopics = [...new Set(topicMatch.map(v => v.SubTopic))]
    subtopics.forEach(subtopic => {
      const subheading = results.appendChild(document.createElement("h4"));
      subheading.textContent = subtopic;
      const subtopicMatch = topicMatch.filter(row => row.SubTopic === subtopic);
      displayRows(subtopicMatch, results);
    });
  });
}

function displayByYear(rows){
  const results = document.querySelector("#Results");
  const years = [...new Set(rows.map(v => new Date(v.Date).getFullYear()))];
  years.toSorted().toReversed().forEach(year => {
    const yearMatch = rows.filter(row => new Date(row.Date).getFullYear() === year);
    const heading = results.appendChild(document.createElement("h3"));
    heading.textContent = year;
    displayRows(yearMatch, results);
  });
}

function searchRows(rows, query) {

xmlhttp.onload = function() {
  const response = JSON.parse(this.responseText);
  console.log(response)
  const rows = response.data
  // Replace blank topics so that search works
  rows.forEach(item => {
    if (!item.Topic) {
      item.Topic = "Unclassified"; // Directly mutates the original object
    }
  });
  // Get possible topics (medical, path-planning, etc)
  const topics = [...new Set(rows.map(v => v.Topic))]
  topics.forEach(topic => {
    document.querySelector('#Topic').appendChild(new Option(topic, topic))
  });
  // Get possible types (journal, conference, etc)
  const kinds = [...new Set(rows.map(v => v.Kind))]
  kinds.forEach(element => {
    document.querySelector('#Kind').appendChild(new Option(element, element))
  });
  // Refresh the form
  const form = document.querySelector('#PaperFilter')
  form.style.display = 'none';
  form.offsetHeight; // Reading this layout property forces a synchronous reflow
  form.style.display = ''; // Restore the original display state

  // Filter results
  let filtered = rows
  if(urlParams.get("Search")) {
    document.querySelector('#Search').value = urlParams.get("Search");
    filtered  = searchRows(rows, urlParams.get("Search"));
  }
  if(urlParams.get("Topic") && urlParams.get("Topic") !== "*") {
    document.querySelector('#Topic').value = urlParams.get("Topic");
    filtered = filtered.filter(row => row.Topic === urlParams.get("Topic"));
  }
  if(urlParams.get("Kind") && urlParams.get("Kind") !== "*") {
    document.querySelector('#Kind').value = urlParams.get("Kind");
    // Just keep the one we care about if it is in the search params
    filtered = filtered.filter(row => row.Kind === urlParams.get("Kind"));

  }
  // This should always be filled
  document.querySelector('#Sort').value = urlParams.get("Sort");

  // Display results
  if(filtered.length === 0) {
    const results = document.querySelector("#Results");
    results.innerHTML = "No results"
  } else if(urlParams.get("Sort") == "Topic") {
    displayByTopic(filtered);
  } else {
    displayByYear(filtered);
  }
}
xmlhttp.open("GET", "https://data.ri.cmu.edu/api/groups/custom/biorobotics/publications");
xmlhttp.overrideMimeType('text/html; charset=iso-8859-1');
xmlhttp.send();
